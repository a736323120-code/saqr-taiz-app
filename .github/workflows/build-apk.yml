name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Prepare Capacitor Android
        run: |
          # Install Capacitor CLI and Android platform if not already present
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save
          
          # Initialize capacitor config if not present
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "طµظ‚ط± طھط¹ط²" "com.saqr.taiz" --web-dir "dist"
          fi
          
          # Add android platform if directory doesn't exist
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sync web build to android project
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/saqr-taiz-app.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saqr-taiz-android-apk
          path: build-output/saqr-taiz-app.apk
          retention-days: 30
